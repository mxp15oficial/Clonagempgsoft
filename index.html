    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZWW.COM">

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            max-width: 320px;
            width: 100%;
            border: 1px solid #333;
        }
        .loader {
            border: 3px solid #2a2a2a;
            border-top: 3px solid #ff9800;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { font-size: 17px; margin: 0 0 5px 0; color: #fff; }
        p { font-size: 12px; color: #888; margin: 0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h2>Carregando Plataforma...</h2>
        <p>Redirecionando com segurança.</p>
    </div>

    <script>
        // O seu link oficial de afiliado da zww57
        const linkAfiliado = "https://zww57.com/?pid=1940424563&fromPage=AGENCY_ONE";

        // Redireciona automaticamente após meio segundo
        setTimeout(() => {
            window.location.replace(linkAfiliado);
        }, 600);
    </script>

</body>
