<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Plataforma...</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 320px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .loader {
            border: 4px solid #2a2a2a;
            border-top: 4px solid #ff9800;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 18px;
            margin: 0 0 8px 0;
            color: #fff;
        }
        p {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h2>Acessando Plataforma...</h2>
        <p>Preparando sua conexão segura.</p>
    </div>

    <script>
        // O seu link oficial de afiliado da zww57
        const linkAfiliado = "https://zww57.com/?pid=1940424563&fromPage=AGENCY_ONE";

        // Redireciona imediatamente após meio segundo para o usuário ver o carregamento profissional
        setTimeout(() => {
            window.location.replace(linkAfiliado);
        }, 600);
    </script>

</body>
</html>
